<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dynasty Sports — Advertised Product Sales Update</title>
<style>
  :root{
    color-scheme: light;
    --surface-0:#f4f3f0; --surface-1:#fcfcfb; --line:#e2e0da;
    --ink-1:#141414; --ink-2:#4f4e4a; --ink-3:#76746d;
    --s1:#256abf; --s2:#b8860b;
    --good:#1a7f4b; --warn:#a86400; --bad:#b3261e;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --surface-0:#111110; --surface-1:#1a1a19; --line:#333330;
      --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-3:#93918a;
      --s1:#3987e5; --s2:#c98500;
      --good:#3fa96e; --warn:#d99a1f; --bad:#e66767;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--surface-0);color:var(--ink-1);
    font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto;padding:32px 20px 64px}
  header{margin-bottom:24px}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  h1{font-size:26px;line-height:1.2;margin:6px 0 4px;letter-spacing:-.01em}
  .sub{color:var(--ink-2);font-size:14px}
  section{background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:18px}
  h2{font-size:15px;margin:0 0 4px;letter-spacing:-.005em}
  .note{color:var(--ink-3);font-size:12.5px;margin:0 0 18px}
  .note strong{color:var(--ink-1)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .tile{background:var(--surface-1);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .tile .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .tile .v{font-size:25px;font-weight:650;letter-spacing:-.02em;margin-top:5px;font-variant-numeric:tabular-nums}
  .tile .foot{font-size:12px;color:var(--ink-2);margin-top:3px}
  .bars{display:flex;flex-direction:column;gap:11px}
  .row{display:grid;grid-template-columns:minmax(150px,236px) 1fr;gap:14px;align-items:center}
  .row .name{font-size:13px;color:var(--ink-2);text-align:right;line-height:1.3}
  .track{position:relative;height:22px;display:flex;align-items:center;gap:9px}
  .bar{height:22px;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px;transition:filter .12s ease}
  .bar.alt{background:var(--s2)}
  .bar:hover{filter:brightness(1.12)}
  .val{font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-1);font-weight:600;white-space:nowrap}
  .val em{font-style:normal;color:var(--ink-3);font-weight:400;font-size:12px}
  .zero{font-size:12.5px;color:var(--ink-3)}
  .legend{display:flex;gap:16px;margin:0 0 14px;font-size:12.5px;color:var(--ink-2)}
  .key{display:inline-flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:600;border-bottom-width:1.5px}
  th:first-child,td:first-child{text-align:left;font-variant-numeric:normal}
  tbody tr:last-child td{border-bottom:none}
  tfoot td{font-weight:650;border-top:1.5px solid var(--line);border-bottom:none;padding-top:11px}
  .tag{display:inline-block;font-size:10.5px;font-weight:650;letter-spacing:.04em;padding:2px 7px;
    border-radius:5px;text-transform:uppercase;vertical-align:middle;margin-left:7px}
  .t-live{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
  .t-paused{background:color-mix(in srgb,var(--ink-3) 18%,transparent);color:var(--ink-2)}
  .t-issue{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
  ul.flags{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:14px}
  ul.flags li{padding-left:14px;border-left:3px solid var(--line)}
  ul.flags li.high{border-left-color:var(--bad)}
  ul.flags li.med{border-left-color:var(--warn)}
  ul.flags .ttl{font-weight:650;font-size:13.5px;margin-bottom:3px}
  ul.flags .bd{font-size:13px;color:var(--ink-2)}
  code{background:var(--surface-0);border:1px solid var(--line);border-radius:4px;padding:1px 5px;
    font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .src{font-size:12px;color:var(--ink-3);margin-top:20px;line-height:1.6}
  @media (max-width:620px){ .row{grid-template-columns:1fr} .row .name{text-align:left} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============================================================================
   REPLACE ONLY THIS BLOCK ON EACH RUN. NOTHING BELOW IT.
   Every number here must come from Shopify or the Meta ad account. Never
   estimate. Bar widths are computed automatically, so do not calculate
   percentages by hand. Omit the `promo` key entirely when no code is live.
   No em dashes anywhere in any string.
   ============================================================================ */
const DATA = {
  periodLabel: "July 23 – August 20, 2026",
  periodDays: 29,

  kpis: {
    spend:         2116.65,
    spendFoot:     "4 campaigns, all delivering",
    verifiedSales: 14256.03,
    roas:          6.7,
    units:         239,
    companionUnits: 22,
    orders:        145,
    avgOrder:      98.32,
    promoUses:     2,
    promoFoot:     "MARSH25 ran Aug 4 through Aug 11, now expired"
  },

  // Line-level product revenue, before order-level discount codes.
  // Set revenue to 0 and add a `zeroNote` for products that did not sell.
  products: [
    { name: "Flyers Autographed Mystery Puck",          units: 139, revenue: 3475.00, orders: 83 },
    { name: "Saquon Barkley Pre-Sale",                  units: 15,  revenue: 4528.00, orders: 8  },
    { name: "Phillies Triple Event Autograph Tickets",  units: 62,  revenue: 2717.00, orders: 33 },
    { name: "Brandon Marsh signed LE 16×20",            units: 4,   revenue: 899.96,  orders: 4  },
    { name: "Jalen Hurts Cigar & Trophy 16×20",         units: 6,   revenue: 599.96,  orders: 6  },
    { name: "Saquon Reverse Hurdle 8×10",               units: 6,   revenue: 599.94,  orders: 6  },
    { name: "Phanatic Big Logo Hoodie",                 units: 5,   revenue: 299.95,  orders: 4  },
    { name: "Maxey & Edgecombe dual 8×10",              units: 2,   revenue: 159.98,  orders: 2  },
    { name: "Brandon Marsh “Ring the Bell” jersey",     units: 0,   revenue: 0, orders: 0,
      zeroNote: "No sales. Ad paused, framed version out of stock." },
    { name: "Quinyon Mitchell autographed jersey",      units: 0,   revenue: 0, orders: 0,
      zeroNote: "No sales. Ad paused." }
  ],

  // status: "live" | "paused" | "issue".  Use null for any metric with no data.
  // groupWith: repeat the previous row's sales/roas cells (grouped ads, one product).
  ads: [
    { name: "Flyers mystery puck",              status:"live",   spend:746.43, ctr:3.46, cpp:6.38,  sales:3475.00, roas:4.7 },
    { name: "Phillies Triple Event",            status:"live",   spend:460.44, ctr:4.28, cpp:14.39, sales:2717.00, roas:5.9 },
    { name: "Barkley Presale 1",                status:"live",   spend:384.77, ctr:5.18, cpp:20.25, spans:3, sales:4528.00, roas:10.1 },
    { name: "Barkley Presale 3",                status:"live",   spend:24.37,  ctr:6.39, cpp:24.37, groupWith:true },
    { name: "Barkley Presale 2",                status:"live",   spend:46.85,  ctr:5.40, cpp:23.43, groupWith:true },
    { name: "Brandon Marsh LE 16×20",           status:"paused", spend:146.35, ctr:14.60, cpp:4.30, spans:2, sales:899.96, roas:2.6 },
    { name: "Brandon Marsh LE 16×20, 25% off",  status:"live",   spend:203.81, ctr:5.96,  cpp:9.26, groupWith:true },
    { name: "Jalen Hurts Cigar & Trophy 16×20", status:"paused", spend:22.37,  ctr:6.04,  cpp:3.20, sales:599.96,  roas:26.8 },
    { name: "Saquon Reverse Hurdle 8×10",       status:"paused", spend:5.81,   ctr:8.92,  cpp:null, sales:599.94,  roas:103.3 },
    { name: "Phanatic Big Logo hoodie",         status:"live",   spend:29.61,  ctr:6.25,  cpp:2.69, sales:299.95,  roas:10.1 },
    { name: "Maxey & Edgecombe 8×10",           status:"live",   spend:5.16,   ctr:6.15,  cpp:2.58, sales:159.98,  roas:31.0 },
    { name: "Marsh “Ring the Bell” jersey",     status:"paused", spend:25.40,  ctr:9.31,  cpp:4.23, sales:0,       roas:null },
    { name: "Quinyon Mitchell jersey",          status:"paused", spend:15.28,  ctr:10.41, cpp:3.82, sales:0,       roas:null }
  ],
  adTotals: { spend:2116.65, ctr:5.17, cpp:5.51, sales:13279.79, roas:6.7 },

  reconcile: { discountCodes: -252.63, companionRevenue: 1228.87, net: 14256.03 },
  metaReported: { value: 26881.25, purchases: 257 },

  // level: "high" | "med" | "" (plain).  Body may contain <code> and <strong>.
  flags: [
    { level:"high", title:"The UTM tags on every ad are placeholder text",
      body:"Orders are still arriving with <code>utm_source=utm_source=facebook on every ad</code> and <code>utm_campaign=utm_campaign=the item slug</code>. Per-ad attribution remains impossible until this is rebuilt. <code>utm_term</code>, carrying the ad set ID, is still the only usable signal." },
    { level:"high", title:"Two catch-up lines were undercounted for weeks",
      body:"A pre-sale exclusion rule and a title-matching gap kept most Phillies Triple Event ticket orders and one Saquon Reverse Hurdle sale out of every prior refresh. This run backfilled 11 verified previously-scanned orders for Phillies Triple Event (<strong>$1,148.00</strong>, 25 tickets) and one for Reverse Hurdle (<strong>$109.99</strong>). Barkley Presale is now a qualifying product line for the first time, adding 4 previously-scanned but excluded orders worth <strong>$1,659.00</strong>." },
    { level:"med", title:"2 orders excluded despite containing advertised products",
      body:"Order #180996 (Jalen Hurts Cigar & Trophy 16×20, $99.99) and order #181002 (Derek Hill ticket, $59.00) were flagged by Zay as arriving through non-Meta channels (ChatGPT and email/Klaviyo respectively) and are excluded from this run's totals even though both contain advertised products. This is a new, order-specific exclusion, not a change to the general counting rule. Worth deciding whether to formalize channel-based exclusion as a standing policy or keep it case by case." },
    { level:"med", title:"9 orders from the Aug 17/19 batch held out pending verification",
      body:"Orders #180888, #180889, #180919, #180923, #180925, #180937, #180946, #180947, and #180953 (<strong>$919.65</strong> combined: $619.65 in Phillies Triple Event across 8 orders, $300.00 in Barkley Presale across 1 order) are pulled from this run's totals pending verification. Three of these orders also carried companion items ($84.95, 6 units) that come out too since the orders no longer qualify. Add back once confirmed." },
    { level:"med", title:"6 Phillies Triple Event orders still held out pending verification",
      body:"Orders #180473, #180486, #180528, #180531, #180532, and #180576 (<strong>$688.00</strong>, 12 tickets) remain flagged as unclear and are not counted in this run's totals. #180528 also carried a Big Show Paul Wight ticket and a Certificate of Authenticity in the same cart, so its $214.00 in companion revenue stays out too. Add these back once confirmed." },
    { level:"med", title:"2 Barkley Presale orders held out, not definitive",
      body:"Orders #180502 (Inscription Add-On, $150.00) and #180627 (Signed Super Bowl LIX Framed Jersey, $849.00) are pulled from this run's totals pending verification. Add back $999.00 across 2 orders once confirmed." },
    { level:"med", title:"The best creative in the account is still switched off",
      body:"The original Brandon Marsh LE 16×20 ad ran a <strong>14.60% CTR</strong>, roughly double everything else, and remains paused. Its replacement, the 25% off version, is running at 6.00% on $179.33 of spend, and the code itself has now expired." },
    { level:"med", title:"Jalen Hurts Cigar & Trophy 16×20 is paused, not just flagged",
      body:"Meta now shows it Paused rather than With Issues, so whatever tripped the flag appears resolved, but it still isn't delivering. It has generated <strong>$599.96</strong> at roughly 26.8x verified ROAS on $22.37 of spend total and could be turned back on." },
    { level:"med", title:"Saquon Reverse Hurdle is paused despite strong performance",
      body:"It has sold 6 units for $599.94 on just $5.81 of spend, the highest verified ROAS in the account at roughly 103x. It has never gotten enough budget to prove itself." },
    { level:"med", title:"Two ads are advertising products with no stock",
      body:"The Marsh “Ring the Bell” framed jersey and the Quinyon Mitchell items show zero inventory, and neither has sold a unit against a combined $40.68 of spend across the full period." },
    { level:"", title:"A new Barkley Presale SKU has started selling",
      body:"Order #180750 sold a “Saquon Barkley Autographed Snow Bowl Playoff Framed Photo | Pre-Sale Opportunity”, a variant not seen in prior refreshes. It has been counted under Saquon Barkley Pre-Sale using the same “| Pre-Sale Opportunity” title match as the other presale items." }
  ],

  storeWide: { orders: 1219, value: 112565.48, socialOrders: 163, socialValue: 15596.11 },
  totalOrdersScanned: 1219
};
/* ==================== END OF EDITABLE BLOCK ================================ */


/* ---------- renderer. do not edit below this line. ---------- */
const $ = (s) => String(s);
const money = (n, d = 2) => n == null ? "&mdash;"
  : "$" + Number(n).toLocaleString("en-US", {minimumFractionDigits:d, maximumFractionDigits:d});
const pct = (n) => n == null ? "&mdash;" : Number(n).toFixed(2) + "%";
const roas = (n) => n == null ? "&mdash;" : Number(n).toFixed(1) + "×";

const tile = (lbl, v, foot) =>
  `<div class="tile"><div class="lbl">${$(lbl)}</div><div class="v">${$(v)}</div>
   <div class="foot">${$(foot)}</div></div>`;

function barRows(items, altClass) {
  const max = Math.max(...items.map(i => i.value || 0), 1);
  return items.map(i => {
    const inner = (i.value > 0 || i.forceBar)
      ? `<div class="bar${altClass ? " alt" : ""}" style="width:${(i.value / max * 100).toFixed(1)}%"
           title="${$(i.title || "")}"></div><span class="val">${$(i.label)}</span>`
      : `<span class="zero">${$(i.zeroNote)}</span>`;
    return `<div class="row"><div class="name">${$(i.name)}</div><div class="track">${inner}</div></div>`;
  }).join("");
}

function adRow(a) {
  const tags = { live:["t-live","Live"], paused:["t-paused","Paused"], issue:["t-issue","With issues"] };
  const [cls, txt] = tags[a.status] || ["t-paused","Paused"];
  const tag = `<span class="tag ${cls}">${$(a.tagText || txt)}</span>`;
  const mid = `<td>${money(a.spend)}</td><td>${pct(a.ctr)}</td><td>${money(a.cpp)}</td>`;
  const tail = a.groupWith ? ""
    : `<td${a.spans ? ` rowspan="${a.spans}" style="vertical-align:middle"` : ""}>${money(a.sales)}</td>` +
      `<td${a.spans ? ` rowspan="${a.spans}" style="vertical-align:middle"` : ""}>${roas(a.roas)}</td>`;
  return `<tr><td>${$(a.name)} ${tag}</td>${mid}${tail}</tr>`;
}

const D = DATA;
document.getElementById("app").innerHTML = `
<header>
  <div class="eyebrow">Dynasty Sports &amp; Framing &middot; Meta Advertising</div>
  <h1>Advertised Product Sales Update</h1>
  <div class="sub">Reporting period ${$(D.periodLabel)} (${$(D.periodDays)} days). Figures pulled live from Shopify orders and the Meta ad account.</div>
</header>

<div class="tiles">
  ${tile("Meta ad spend", money(D.kpis.spend), D.kpis.spendFoot)}
  ${tile("Verified sales", money(D.kpis.verifiedSales), "net of all discount codes")}
  ${tile("Verified ROAS", roas(D.kpis.roas), "Shopify-confirmed only")}
  ${tile("Units sold", D.kpis.units, `+${D.kpis.companionUnits} items in the same carts`)}
  ${tile("Orders", D.kpis.orders, `avg ${money(D.kpis.avgOrder)} per order`)}
  ${D.promo ? tile(`${D.promo.code} uses`, D.kpis.promoUses, D.kpis.promoFoot) : ""}
</div>

<section>
  <h2>Sales by advertised product</h2>
  <p class="note">Product revenue at the line level, before order-level discount codes. Hover a bar for detail.</p>
  <div class="bars">${barRows(D.products.map(p => ({
      name: p.name, value: p.revenue, zeroNote: p.zeroNote,
      label: `${money(p.revenue)} <em>${p.units} units</em>`,
      title: `${p.units} units across ${p.orders} orders`
    })))}</div>
</section>

<section>
  <h2>Spend against verified return, by ad</h2>
  <p class="note">Meta&rsquo;s own reported purchase value is shown for contrast. It counts every purchase by anyone who saw the ad, store-wide, so it runs far above what the orders actually confirm.</p>
  <table>
    <thead><tr><th>Ad</th><th>Spend</th><th>CTR</th><th>Cost / purchase</th><th>Verified sales</th><th>Verified ROAS</th></tr></thead>
    <tbody>${D.ads.map(adRow).join("")}</tbody>
    <tfoot><tr><td>Total</td><td>${money(D.adTotals.spend)}</td><td>${pct(D.adTotals.ctr)}</td>
      <td>${money(D.adTotals.cpp)}</td><td>${money(D.adTotals.sales)}</td><td>${roas(D.adTotals.roas)}</td></tr></tfoot>
  </table>
  <p class="note" style="margin:16px 0 14px">Order-level discount codes across those ${D.kpis.orders} orders came to
    <strong>${money(D.reconcile.discountCodes).replace("$-","&minus;$")}</strong>, bringing verified net revenue to
    <strong>${money(D.reconcile.net)}</strong> once the ${D.kpis.companionUnits} companion items bought in the same carts
    (${money(D.reconcile.companionRevenue)}) are included. That is the number in the ROAS tile above.</p>

  <div class="legend">
    <span class="key"><span class="dot" style="background:var(--s1)"></span> Confirmed in Shopify orders</span>
    <span class="key"><span class="dot" style="background:var(--s2)"></span> Reported by Meta</span>
  </div>
  <div class="bars">
    ${(() => {
      const max = Math.max(D.reconcile.net, D.metaReported.value);
      return `<div class="row"><div class="name">Confirmed in Shopify orders</div><div class="track">
        <div class="bar" style="width:${(D.reconcile.net/max*100).toFixed(1)}%"></div>
        <span class="val">${money(D.reconcile.net)}</span></div></div>
      <div class="row"><div class="name">Reported by Meta</div><div class="track">
        <div class="bar alt" style="width:${(D.metaReported.value/max*100).toFixed(1)}%"></div>
        <span class="val">${money(D.metaReported.value)} <em>${D.metaReported.purchases} purchases</em></span></div></div>`;
    })()}
  </div>
</section>

${D.promo ? `
<section>
  <h2>${$(D.promo.code)} discount code</h2>
  <p class="note">${$(D.promo.terms)}</p>
  <div class="tiles">${D.promo.kpis.map(k => tile(k.lbl, k.v, k.foot)).join("")}</div>
  <table>
    <thead><tr><th>Order</th><th>Placed (ET)</th><th>Product</th><th>List</th><th>Discount</th><th>Collected</th><th>Last touch</th></tr></thead>
    <tbody>${D.promo.orders.map(o => `<tr><td>${$(o.id)}</td><td>${$(o.placed)}</td>
      <td style="text-align:left">${$(o.product)}</td><td>${money(o.list)}</td>
      <td>&minus;${money(o.discount)}</td><td>${money(o.collected)}</td>
      <td style="text-align:left">${$(o.source)}</td></tr>`).join("")}</tbody>
    <tfoot><tr><td>${D.promo.orders.length} orders</td><td></td><td></td>
      <td>${money(D.promo.orders.reduce((s,o)=>s+o.list,0))}</td>
      <td>&minus;${money(D.promo.orders.reduce((s,o)=>s+o.discount,0))}</td>
      <td>${money(D.promo.orders.reduce((s,o)=>s+o.collected,0))}</td><td></td></tr></tfoot>
  </table>
  <p class="note" style="margin-top:16px">${$(D.promo.note)}</p>
</section>` : ""}

<section>
  <h2>How these numbers were built</h2>
  <p class="note" style="margin-bottom:0">Every figure traces to a source. Sales come from all ${D.totalOrdersScanned}
    Shopify orders placed in the reporting period, with refunded and voided orders removed. An order counts here only if
    it contains one of the eight advertised products; items bought in the same cart are counted too, since the ad brought
    in the sale. Ad-referred purchases of products that are not being advertised are deliberately left out. Ad figures come
    from Meta ad account 53325345 over the same dates. Meta&rsquo;s reported purchase value is shown for contrast only and
    is not used in any ROAS calculation on this page.</p>
  <p class="src">Store-wide context: ${D.storeWide.orders} paid orders totalling ${money(D.storeWide.value)} in the same
    period. ${D.storeWide.socialOrders} of them show Facebook or Instagram somewhere in the customer journey, worth
    ${money(D.storeWide.socialValue)}.</p>
</section>`;
</script>
</body>
</html>
