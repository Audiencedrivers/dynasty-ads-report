<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dynasty Sports — Advertised Product Sales Update</title>
<style>
  :root{
    color-scheme: light;
    --surface-0:#f4f3f0; --surface-1:#fcfcfb; --line:#e2e0da;
    --ink-1:#141414; --ink-2:#4f4e4a; --ink-3:#76746d;
    --s1:#256abf; --s2:#b8860b;
    --good:#1a7f4b; --warn:#a86400; --bad:#b3261e;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --surface-0:#111110; --surface-1:#1a1a19; --line:#333330;
      --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-3:#93918a;
      --s1:#3987e5; --s2:#c98500;
      --good:#3fa96e; --warn:#d99a1f; --bad:#e66767;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--surface-0);color:var(--ink-1);
    font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto;padding:32px 20px 64px}
  header{margin-bottom:24px}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  h1{font-size:26px;line-height:1.2;margin:6px 0 4px;letter-spacing:-.01em}
  .sub{color:var(--ink-2);font-size:14px}
  section{background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:18px}
  h2{font-size:15px;margin:0 0 4px;letter-spacing:-.005em}
  .note{color:var(--ink-3);font-size:12.5px;margin:0 0 18px}
  .note strong{color:var(--ink-1)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .tile{background:var(--surface-1);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .tile .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .tile .v{font-size:25px;font-weight:650;letter-spacing:-.02em;margin-top:5px;font-variant-numeric:tabular-nums}
  .tile .foot{font-size:12px;color:var(--ink-2);margin-top:3px}
  .bars{display:flex;flex-direction:column;gap:11px}
  .row{display:grid;grid-template-columns:minmax(150px,236px) 1fr;gap:14px;align-items:center}
  .row .name{font-size:13px;color:var(--ink-2);text-align:right;line-height:1.3}
  .track{position:relative;height:22px;display:flex;align-items:center;gap:9px}
  .bar{height:22px;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px;transition:filter .12s ease}
  .bar.alt{background:var(--s2)}
  .bar:hover{filter:brightness(1.12)}
  .val{font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-1);font-weight:600;white-space:nowrap}
  .val em{font-style:normal;color:var(--ink-3);font-weight:400;font-size:12px}
  .zero{font-size:12.5px;color:var(--ink-3)}
  .legend{display:flex;gap:16px;margin:0 0 14px;font-size:12.5px;color:var(--ink-2)}
  .key{display:inline-flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:600;border-bottom-width:1.5px}
  th:first-child,td:first-child{text-align:left;font-variant-numeric:normal}
  tbody tr:last-child td{border-bottom:none}
  tfoot td{font-weight:650;border-top:1.5px solid var(--line);border-bottom:none;padding-top:11px}
  .tag{display:inline-block;font-size:10.5px;font-weight:650;letter-spacing:.04em;padding:2px 7px;
    border-radius:5px;text-transform:uppercase;vertical-align:middle;margin-left:7px}
  .t-live{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
  .t-paused{background:color-mix(in srgb,var(--ink-3) 18%,transparent);color:var(--ink-2)}
  .t-issue{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
  ul.flags{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:14px}
  ul.flags li{padding-left:14px;border-left:3px solid var(--line)}
  ul.flags li.high{border-left-color:var(--bad)}
  ul.flags li.med{border-left-color:var(--warn)}
  ul.flags .ttl{font-weight:650;font-size:13.5px;margin-bottom:3px}
  ul.flags .bd{font-size:13px;color:var(--ink-2)}
  code{background:var(--surface-0);border:1px solid var(--line);border-radius:4px;padding:1px 5px;
    font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .src{font-size:12px;color:var(--ink-3);margin-top:20px;line-height:1.6}
  @media (max-width:620px){ .row{grid-template-columns:1fr} .row .name{text-align:left} }
</style>
</head>

/* ---------- renderer. do not edit below this line. ---------- */
const $ = (s) => String(s);
const money = (n, d = 2) => n == null ? "&mdash;"
  : "$" + Number(n).toLocaleString("en-US", {minimumFractionDigits:d, maximumFractionDigits:d});
const pct = (n) => n == null ? "&mdash;" : Number(n).toFixed(2) + "%";
const roas = (n) => n == null ? "&mdash;" : Number(n).toFixed(1) + "×";

const tile = (lbl, v, foot) =>
  `<div class="tile"><div class="lbl">${$(lbl)}</div><div class="v">${$(v)}</div>
   <div class="foot">${$(foot)}</div></div>`;

function barRows(items, altClass) {
  const max = Math.max(...items.map(i => i.value || 0), 1);
  return items.map(i => {
    const inner = (i.value > 0 || i.forceBar)
      ? `<div class="bar${altClass ? " alt" : ""}" style="width:${(i.value / max * 100).toFixed(1)}%"
           title="${$(i.title || "")}"></div><span class="val">${$(i.label)}</span>`
      : `<span class="zero">${$(i.zeroNote)}</span>`;
    return `<div class="row"><div class="name">${$(i.name)}</div><div class="track">${inner}</div></div>`;
  }).join("");
}

function adRow(a) {
  const tags = { live:["t-live","Live"], paused:["t-paused","Paused"], issue:["t-issue","With issues"] };
  const [cls, txt] = tags[a.status] || ["t-paused","Paused"];
  const tag = `<span class="tag ${cls}">${$(a.tagText || txt)}</span>`;
  const mid = `<td>${money(a.spend)}</td><td>${pct(a.ctr)}</td><td>${money(a.cpp)}</td>`;
  const tail = a.groupWith ? ""
    : `<td${a.spans ? ` rowspan="${a.spans}" style="vertical-align:middle"` : ""}>${money(a.sales)}</td>` +
      `<td${a.spans ? ` rowspan="${a.spans}" style="vertical-align:middle"` : ""}>${roas(a.roas)}</td>`;
  return `<tr><td>${$(a.name)} ${tag}</td>${mid}${tail}</tr>`;
}

    <thead><tr><th>Order</th><th>Placed (ET)</th><th>Product</th><th>List</th><th>Discount</th><th>Collected</th><th>Last touch</th></tr></thead>
    <tbody>${D.promo.orders.map(o => `<tr><td>${$(o.id)}</td><td>${$(o.placed)}</td>
      <td style="text-align:left">${$(o.product)}</td><td>${money(o.list)}</td>
      <td>&minus;${money(o.discount)}</td><td>${money(o.collected)}</td>
      <td style="text-align:left">${$(o.source)}</td></tr>`).join("")}</tbody>
    <tfoot><tr><td>${D.promo.orders.length} orders</td><td></td><td></td>
      <td>${money(D.promo.orders.reduce((s,o)=>s+o.list,0))}</td>
      <td>&minus;${money(D.promo.orders.reduce((s,o)=>s+o.discount,0))}</td>
      <td>${money(D.promo.orders.reduce((s,o)=>s+o.collected,0))}</td><td></td></tr></tfoot>
  </table>
  <p class="note" style="margin-top:16px">${$(D.promo.note)}</p>
</section>` : ""}

<section>
  <h2>How these numbers were built</h2>
  <p class="note" style="margin-bottom:0">Every figure traces to a source. Sales come from all ${D.totalOrdersScanned}
    Shopify orders placed in the reporting period, with refunded and voided orders removed. An order counts here only if
    it contains one of the eight advertised products; items bought in the same cart are counted too, since the ad brought
    in the sale. Ad-referred purchases of products that are not being advertised are deliberately left out. Ad figures come
    from Meta ad account 53325345 over the same dates. Meta&rsquo;s reported purchase value is shown for contrast only and
    is not used in any ROAS calculation on this page.</p>
  <p class="src">Store-wide context: ${D.storeWide.orders} paid orders totalling ${money(D.storeWide.value)} in the same
    period. ${D.storeWide.socialOrders} of them show Facebook or Instagram somewhere in the customer journey, worth
    ${money(D.storeWide.socialValue)}.</p>
</section>`;
</script>
